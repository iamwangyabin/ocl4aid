# MVP prompt layout and optional routing/head settings.
pos_g_prompt: [0, 1]
len_g_prompt: 5
pos_e_prompt: [2, 3, 4]
len_e_prompt: 20
g_pool: 1
e_pool: 10
selection_size: 1
prompt_func: prompt_tuning
lambd: 1.0
use_mask: true
use_contrastiv: true
use_last_layer: false
use_rp_gate: false
use_ema_head: false
rp_dim: 10000
rp_ridge: 10000
ema_ratio: [0.9, 0.99]
ensemble_method: softmax_max_prob
