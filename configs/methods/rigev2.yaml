# RIGEv2: residual Gaussian experts with head-weight-selected replay features.
rigev2_feature_layers: quartile
rigev2_online_feature_layers: same
rigev2_replay_dim: 1536
rigev2_feature_block_dim: 768
rigev2_head_type: lowrank
rigev2_online_head_type: lowrank
rigev2_rank: 16
rigev2_online_rank: 4
rigev2_hidden_dim: 512
rigev2_eval_mode: feature_gaussian
rigev2_alpha_init: 0.2
rigev2_route_space: online
rigev2_threshold_mode: gaussian_midpoint
rigev2_eval_fake_prior: 0.5
rigev2_inner_steps: 5
rigev2_replay_window: 8192
rigev2_replay_batch_size: 128
rigev2_update_all_expert_calibration: false
rigev2_route_use_eval_transform: true
rigev2_route_normalize_features: true
rigev2_route_variance_floor: 0.0001
rigev2_route_min_count: 2
rigev2_route_rebuild_max_samples: 20000
rigev2_calibration_score_drift_threshold: 0.2
rigev2_calibration_drift_ema_beta: 0.9
rigev2_calibration_score_window: 5000
rigev2_weight_decay: 0.0001
