# Shared method-level defaults. Framework/run defaults live in configs/framework/.
profile: false
load_pt: false

# MePo / covariance calibration.
mepo_backbone_path:
cov_path:
cov_coef: 0.7

# Shared prompt defaults.
len_prompt: 20
pos_prompt: [0, 1, 2, 3, 4]
logit_type: cos_sim
pos_g_prompt: [0, 1]
len_g_prompt: 5
pos_e_prompt: [2, 3, 4]
len_e_prompt: 20
g_pool: 1
e_pool: 10
selection_size: 1
prompt_func: prompt_tuning
lambd: 1.0
key_dim: 768
ortho_mu: 0.0
use_mask: true
use_contrastiv: true
use_last_layer: false
_batchwise_selection: false
_diversed_selection: true

# FlyPrompt-style optional routing/head bank.
rp_dim: 10000
rp_ridge: 10000
ema_ratio: [0.9, 0.99]
ensemble_method: softmax_max_prob
use_rp_gate: false
use_ema_head: false

# HiDe / NoRGa.
prefix_len: 5
num_prefix_layers: 5
lam_orth: 1
ca_num_per_class: 200
ca_steps: 200

# RanPAC.
adapter_dim: 64
ranpac_M: 10000
ranpac_use_RP: true
use_g_prompt: false

# SD-LoRA / HiDe-LoRA / HiDe-Adapter.
num_lora_layers: 5
num_adapter_layers: 5
sdlora_rank: 10
sdlora_alpha: 0.8
sdlora_layers: all
sdlora_ortho_weight: 0.0

# RINE-side Gaussian.
rine_gauss_var_floor: 0.0001
rine_gauss_min_count: 2
rine_gauss_aggregation: logmeanexp
rine_gauss_feature_layers: quartile
