# RINE-side Gaussian settings.
base_stage_epochs: 1
n_worker: 8
rine_gauss_var_floor: 0.0001
rine_gauss_min_count: 2
rine_gauss_aggregation: logmeanexp
rine_gauss_feature_layers: quartile
rine_gauss_projector_dim: 128
rine_gauss_hidden_dim: 256
rine_gauss_head_aggregation: mean_logit
rine_gauss_replay_per_class: 16
rine_gauss_replay_weight: 1.0
rine_gauss_cov_shrink: 0.01
