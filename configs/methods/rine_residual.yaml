# RINE-Residual: high-dimensional progressive residual experts.
rine_residual_feature_layers: quartile
rine_residual_online_feature_layers: same
rine_residual_head_type: lowrank
rine_residual_online_head_type: linear
rine_residual_rank: 16
rine_residual_hidden_dim: 512
rine_residual_eval_mode: task_oracle
rine_residual_threshold_mode: balanced_prior
rine_residual_eval_fake_prior: 0.5
rine_residual_inner_steps: 2
rine_residual_weight_decay: 0.0001
