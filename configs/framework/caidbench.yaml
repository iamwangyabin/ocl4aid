data:
  root: /home/home/yabin/CAIDBench
  protocol: protocol_presets/caidbench/model_appearance_order_protocol.yaml
  image_column: image

run:
  seeds: [1]
  log_dir: run_logs
  note: ""

model:
  backbone: vit_base_patch16_224

train:
  optimizer: adamw
  scheduler: cosine
  amp: true
  workers: 24
  # Global online exposure batch size; DDP splits this evenly across ranks.
  batch_size: 16
  lr: 0.001
  online_iter: 1
  # Stage 0 (ProGAN) is a supervised base stage. OCL starts at stage 1.
  base_stage_epochs: 10
  # Temporal generator-stage blur. n=100,m=0 recovers hard boundaries.
  stage_blurry_n: 100
  stage_blurry_m: 0
  transforms: [autoaug]
  batch_mask: true
  topk: 1

eval:
  interval: 20000

tracking:
  swanlab: false
