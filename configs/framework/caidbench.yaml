data:
  root: /home/home/yabin/CAIDBench
  protocol: protocol_presets/caidbench/model_appearance_order_protocol.yaml
  image_column: image

run:
  seeds: [1]
  log_dir: run_logs
  note: ""

model:
  backbone: vit_base_patch16_224

train:
  optimizer: sgd
  scheduler: default
  amp: true
  workers: 24
  batch_size: 16
  lr: 0.05
  online_iter: 1
  transforms: [autoaug]
  batch_mask: true
  topk: 1

eval:
  interval: 20000

tracking:
  swanlab: false
