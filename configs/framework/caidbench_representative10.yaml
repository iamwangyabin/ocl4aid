# CAID-Representative10 framework preset.
# Stage 0 (ProGAN) is the supervised base stage; the remaining ten stages are
# the online continual stream. Runtime- and platform-specific paths stay on
# the command line so this preset is portable.
data:
  protocol: protocol_presets/caidbench/model_appearance_order_protocol_representative10.yaml
  image_column: image

run:
  seeds: [1]
  log_dir: run_logs
  note: ""

model:
  backbone: vit_base_patch16_224
  pretrained: true

train:
  optimizer: adamw
  scheduler: cosine
  amp: true
  workers: 24
  # Global online exposure batch size; DDP splits this evenly across ranks.
  batch_size: 16
  lr: 0.001
  online_iter: 1
  base_stage_epochs: 10
  save_base_checkpoint: true
  base_checkpoint_only: false
  # These are generic defaults; launch commands may override them for an
  # ablation or smoke run.
  stage_blurry_n: 50
  stage_blurry_m: 20
  transforms: [autoaug]
  batch_mask: true
  topk: 1

eval:
  interval: 20000

tracking:
  swanlab: true
  project: ocl4aid
  mode: cloud
  group: caid-representative10
  tags: [representative10]
