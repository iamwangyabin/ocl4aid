data:
  protocol: protocol_presets/caidbench/model_appearance_order_protocol_50.yaml
  image_column: image

run:
  seeds: [1]
  log_dir: run_logs
  note: ""

model:
  backbone: vit_base_patch16_224
  pretrained: true

train:
  optimizer: adamw
  scheduler: cosine
  amp: true
  workers: 24
  batch_size: 16
  lr: 0.001
  online_iter: 1
  base_stage_epochs: 10
  save_base_checkpoint: false
  base_checkpoint_only: false
  stage_blurry_n: 100
  stage_blurry_m: 0
  transforms: [autoaug]
  batch_mask: true
  topk: 1

eval:
  interval: 20000

tracking:
  swanlab: false
  project: ocl4aid
  mode: cloud
  group: caid50-hard
  tags: [caid50, hard]
